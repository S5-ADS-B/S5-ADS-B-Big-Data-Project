name: Build group report

on:
  push:
    paths:
      - "groups/*.txt"
      - "build_report.sh"
      - "csv_to_xlsx.py"
  pull_request:
    paths:
      - "groups/*.txt"
      - "build_report.sh"
      - "csv_to_xlsx.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Build Excel report (with repo checks via GitHub CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x build_report.sh
          ./build_report.sh -c -o report.xlsx groups

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: group-report
          path: report.xlsx
          if-no-files-found: error